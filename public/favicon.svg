<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#00f2ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#080d1a" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(0, 242, 255, 0.2)" stroke-width="2" stroke-dasharray="6,4" />
  <!-- Base Turret Body -->
  <circle cx="50" cy="50" r="26" fill="url(#g1)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="14" fill="#060911" />
  <circle cx="50" cy="50" r="6" fill="#00f2ff" />
  <!-- Dual Barrels -->
  <rect x="42" y="10" width="6" height="26" rx="3" fill="#00f2ff" />
  <rect x="52" y="10" width="6" height="26" rx="3" fill="#00f2ff" />
</svg>
